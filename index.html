<style>
/* Concepto: el cuaderno. Una columna de app (móvil primero) sobre papel punteado; la papelería pastel rota por tema;
   la tinta lleva todo el texto y las series; petróleo = mejoró, óxido = empeoró. Una sola apariencia (papel), a propósito. */
:root {
  --papel: #F7F2E8; --papel-hondo: #EFE7D8; --tinta: #1C1B1F; --tinta-suave: #55505B; --linea: #D8CFBE;
  --melocoton: #FFD6BE; --rosa: #FFD2DD; --menta: #CDEBDC; --lavanda: #E1DBF6; --mantequilla: #FFECAE; --cielo: #D1E4F6;
  --mejor: #1F5F6B; --peor: #8E3A12; --igual: #575B63; --sin: #DCD6CB;
  --f-titulo: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-texto: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mano: "Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --radio: 16px; --borde: 2px solid var(--tinta); --recorte: 4px 4px 0 var(--tinta);
  --curva: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--papel); }
body { margin: 0; color: var(--tinta); font-family: var(--f-texto); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(var(--linea) 1.3px, transparent 1.4px); background-size: 22px 22px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--papel); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
h1, h2 { font-family: var(--f-titulo); font-weight: 400; line-height: 1.02; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(40px, 10vw, 60px); }
h2 { font-size: clamp(30px, 7.5vw, 42px); }
h3 { font-size: 19px; margin: 0; line-height: 1.25; }
p { margin: 0; text-wrap: pretty; }
em { font-family: var(--f-titulo); font-style: italic; font-size: 1.08em; }
.mano { font-family: var(--f-mano); font-weight: 700; font-size: 26px; line-height: 1.05; }
.chico { font-size: 14px; color: var(--tinta-suave); }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; border-radius: 10px; }

/* armazón */
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(104px + env(safe-area-inset-bottom, 0px)); }
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 0 10px; background: var(--papel); border-bottom: 1.5px dashed var(--linea); }
.barra .logo { width: 128px; color: var(--tinta); display: block; }
.barra .logo svg { width: 100%; height: auto; display: block; }
.estado { display: flex; gap: 8px; }
.pildora { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1.5px solid var(--tinta); border-radius: 999px;
  font-weight: 700; font-size: 14px; background: var(--papel); white-space: nowrap; }
.pildora svg { width: 16px; height: 16px; }
.vista { display: grid; gap: 22px; padding-top: 20px; }
.vista > * { min-width: 0; }

/* barra inferior */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--papel); border-top: 2px solid var(--tinta);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab { display: grid; justify-items: center; gap: 2px; padding: 6px 0; background: none; border: 0; font-size: 12px; font-weight: 600; color: var(--tinta-suave); text-decoration: none; min-height: 52px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--tinta); }
.tab[aria-current="page"] span { border-bottom: 2px solid var(--tinta); }
.tab-jugar { transform: translateY(-14px); }
.tab-jugar .bola { width: 60px; height: 60px; border-radius: 50%; background: var(--tinta); color: var(--papel); display: grid; place-items: center; box-shadow: 3px 3px 0 var(--linea); }
.tab-jugar .bola svg { width: 28px; height: 28px; }

/* piezas */
.tarjeta { background: var(--papel); border: var(--borde); border-radius: var(--radio); padding: 20px; box-shadow: var(--recorte); display: grid; gap: 12px; }
.nota { background: var(--mantequilla); padding: 16px 18px; border-radius: 4px; box-shadow: 0 10px 20px -14px rgba(28,27,31,.55); }
.boton { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 24px; border-radius: 999px; border: var(--borde);
  font-weight: 700; font-size: 17px; text-decoration: none; transition: transform 140ms var(--curva), box-shadow 140ms var(--curva); }
.boton.tinta { background: var(--tinta); color: var(--papel); box-shadow: 4px 4px 0 var(--linea); }
.boton.papel { background: var(--papel); box-shadow: var(--recorte); }
.boton:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--tinta); }
.boton.ancho { width: 100%; }
.boton[disabled] { opacity: .45; cursor: default; }
.fuente { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--tinta-suave); border-bottom: 1.5px dashed var(--tinta-suave); text-decoration: none; }
.fuente::after { content: "↗"; font-weight: 700; }
.lectura { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.lectura.mejor { color: var(--mejor); } .lectura.peor { color: var(--peor); } .lectura.igual, .lectura.contexto, .lectura.nocomp { color: var(--igual); }
.resaltado { background: linear-gradient(transparent 55%, var(--mantequilla) 55% 92%, transparent 92%); }
.etiqueta { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-suave); }
.fila { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.entre { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* inicio */
.saludo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.saludo .mano { font-size: 30px; }
.saludo .nombre { font-family: var(--f-mano); font-weight: 700; font-size: 34px; border-bottom: 2px solid var(--tinta); min-width: 120px; line-height: 1; padding: 0 4px; background: none; border-top: 0; border-left: 0; border-right: 0; }
.reto-dia { background: var(--melocoton); }
.reto-dia h2 { font-size: 34px; }
.racha-dias { display: flex; gap: 6px; }
.racha-dias i { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--tinta); display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; }
.racha-dias i.si { background: var(--tinta); color: var(--papel); }
.racha-dias i.hoy { outline: 2px dashed var(--tinta); outline-offset: 2px; }
.balance { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.balance div { border: 1.5px solid var(--tinta); border-radius: 12px; padding: 10px; background: var(--papel); }
.balance b { font-family: var(--f-titulo); font-weight: 400; font-size: 40px; line-height: 1; display: block; }

/* estampillas */
.estampillas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.est { position: relative; aspect-ratio: 1; border: 2px solid var(--tinta); border-radius: 6px; display: grid; place-items: center; text-align: center; padding: 10px;
  box-shadow: 3px 3px 0 var(--tinta); text-decoration: none; background: var(--c, var(--papel)); }
.est::before { content: ""; position: absolute; inset: 6px; border: 1.5px dashed var(--tinta); border-radius: 3px; pointer-events: none; }
.est b { font-size: 14px; line-height: 1.15; display: block; }
.est small { display: block; font-size: 12px; color: var(--tinta-suave); font-weight: 600; margin-top: 2px; }
.est.bloq { background: var(--papel-hondo); box-shadow: none; border-style: dashed; }
.est .sello { position: absolute; top: -8px; right: -8px; width: 30px; height: 30px; border-radius: 50%; background: var(--tinta); color: var(--papel); display: grid; place-items: center; font-size: 15px; font-weight: 700; transform: rotate(12deg); }

/* juego */
.juego { display: grid; gap: 18px; }
.marcador { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.reloj { flex: 1; height: 12px; border: 1.5px solid var(--tinta); border-radius: 999px; overflow: hidden; max-width: 160px; }
.reloj i { display: block; height: 100%; background: var(--tinta); width: 100%; transform-origin: left; }
.reloj.apuro i { background: var(--peor); }
.combo { font-family: var(--f-mano); font-size: 26px; transform: rotate(-4deg); }
.puntos-pop { position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%); font-family: var(--f-titulo); font-size: 64px; pointer-events: none; z-index: 30; animation: pop 900ms var(--curva) forwards; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%,-30%) scale(.6) } 25% { opacity: 1; transform: translate(-50%,-50%) scale(1.1) } 100% { opacity: 0; transform: translate(-50%,-90%) scale(1) } }
.pregunta { font-family: var(--f-titulo); font-size: clamp(30px, 8vw, 40px); line-height: 1.05; text-wrap: balance; }
.carta { border: var(--borde); border-radius: 18px; padding: 18px; box-shadow: var(--recorte); display: grid; gap: 6px; background: var(--c, var(--cielo)); }
.carta .grande { font-family: var(--f-titulo); font-size: 64px; line-height: .95; }
.carta.vacia { background: var(--papel-hondo); border-style: dashed; box-shadow: none; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dos > .boton { width: 100%; padding: 0 10px; }
.opciones { display: grid; gap: 10px; }
.opcion { text-align: left; min-height: 56px; padding: 12px 16px; border: var(--borde); border-radius: 14px; background: var(--c, var(--papel)); box-shadow: 3px 3px 0 var(--tinta); font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 12px; }
.opcion .letra { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--tinta); display: grid; place-items: center; font-size: 14px; flex: none; background: var(--papel); }
.opcion.bien, .boton.bien { outline: 4px solid var(--mejor); outline-offset: 3px; opacity: 1; }
.boton.mal { outline: 4px solid var(--peor); outline-offset: 3px; opacity: 1; }
.opcion.mal { outline: 4px solid var(--peor); outline-offset: 2px; opacity: .8; }
.deslizador { display: grid; gap: 10px; }
.lectura-grande { font-family: var(--f-titulo); font-size: 76px; line-height: 1; text-align: center; }
.lectura-grande small { font-family: var(--f-texto); font-size: 16px; color: var(--tinta-suave); display: block; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 999px; background: var(--papel-hondo); border: 1.5px solid var(--tinta); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 999px; background: var(--papel-hondo); border: 1.5px solid var(--tinta); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; margin-top: -13px; border-radius: 50%; background: var(--mantequilla); border: 2px solid var(--tinta); box-shadow: 2px 2px 0 var(--tinta); }
input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: var(--mantequilla); border: 2px solid var(--tinta); box-shadow: 2px 2px 0 var(--tinta); }
.escala { display: flex; justify-content: space-between; font-size: 13px; color: var(--tinta-suave); font-weight: 600; }
.revelar { display: grid; gap: 12px; animation: entra 360ms var(--curva); }
@keyframes entra { from { transform: translateY(10px); opacity: .3 } to { transform: none; opacity: 1 } }
.veredicto { font-family: var(--f-mano); font-size: 40px; line-height: 1; transform: rotate(-3deg); display: inline-block; padding: 2px 14px; border: 2.5px solid currentColor; border-radius: 10px; }
.veredicto.bien { color: var(--mejor); } .veredicto.casi { color: var(--igual); } .veredicto.mal { color: var(--peor); }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart text { font-family: var(--f-texto); font-size: 11px; fill: var(--tinta-suave); }
.chart .t-tinta { fill: var(--tinta); font-weight: 700; }
.chart-caja { position: relative; }

/* final de ronda */
.final h1 { font-size: clamp(44px, 11vw, 64px); }
.estrellas { display: flex; gap: 6px; }
.estrellas svg { width: 36px; height: 36px; }
.barra-nivel { height: 14px; border: 1.5px solid var(--tinta); border-radius: 999px; overflow: hidden; background: var(--papel); }
.barra-nivel i { display: block; height: 100%; background: var(--tinta); transition: width 900ms var(--curva); }
.sobre { position: relative; border: var(--borde); border-radius: 10px; background: var(--rosa); padding: 22px; box-shadow: var(--recorte); text-align: center; display: grid; gap: 10px; }
.sobre .solapa { height: 46px; background: linear-gradient(to bottom right, transparent 49%, var(--tinta) 49.5% 50.5%, transparent 51%), linear-gradient(to bottom left, transparent 49%, var(--tinta) 49.5% 50.5%, transparent 51%); background-size: 50% 100%; background-repeat: no-repeat; background-position: left, right; }
.carta-dato { border: var(--borde); border-radius: 14px; padding: 18px; background: var(--papel); box-shadow: var(--recorte); display: grid; gap: 10px; animation: voltea 600ms var(--curva); }
@keyframes voltea { from { transform: perspective(800px) rotateY(80deg); opacity: 0 } to { transform: none; opacity: 1 } }
.rareza { font-family: var(--f-mano); font-size: 24px; }
.rareza.rara { color: var(--mejor); } .rareza.legendaria { color: var(--peor); }
.tarjeta-img { width: 100%; border-radius: 12px; border: 1.5px solid var(--tinta); display: block; }
.compartir { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compartir .boton { width: 100%; padding: 0 10px; font-size: 15px; }

/* temas */
.tema-cab { border: var(--borde); border-radius: var(--radio); padding: 20px; background: var(--c); box-shadow: var(--recorte); display: grid; gap: 10px; }
.indicador { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1.5px solid var(--linea); }
.indicador .cifras { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; white-space: nowrap; }
.indicador .nombre { font-weight: 600; font-size: 15px; line-height: 1.3; }
.indicador .pie { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.caso { border: 1.5px solid var(--tinta); border-radius: 14px; padding: 14px; background: var(--papel); display: grid; gap: 6px; }
.estado-j { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1.5px solid var(--tinta); background: var(--papel-hondo); white-space: nowrap; }
.estado-j.firme { background: var(--tinta); color: var(--papel); }
.tira { display: grid; grid-template-columns: repeat(26, 1fr); gap: 2px; }
.tira i { height: 36px; border-radius: 3px; border: 1px solid var(--tinta); }
.filtros { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--tinta); background: var(--papel); font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
.dibujo-ayuda { font-family: var(--f-mano); font-size: 22px; text-align: center; }

/* cartas coleccionables */
.coleccion { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.mini { aspect-ratio: 3/4; border: 1.5px solid var(--tinta); border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mano); font-size: 26px; background: var(--c, var(--papel)); padding: 4px; text-align: center; }
.mini.no { background: var(--papel-hondo); border-style: dashed; color: var(--tinta-suave); }
.ajuste { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1.5px solid var(--linea); }
.interruptor { width: 56px; height: 32px; border-radius: 999px; border: 2px solid var(--tinta); background: var(--papel-hondo); position: relative; flex: none; }
.interruptor::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--tinta); transition: left 160ms var(--curva); }
.interruptor[aria-checked="true"] { background: var(--menta); }
.interruptor[aria-checked="true"]::after { left: 27px; }

/* aula */
.aula-app { max-width: 1200px; }
.aula-pantalla { display: grid; gap: 20px; }
.aula-pregunta { font-family: var(--f-titulo); font-size: clamp(32px, 5vw, 64px); line-height: 1.05; }
.aula-ops { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.aula-ops .opcion { font-size: clamp(18px, 2.2vw, 28px); min-height: 72px; }
.equipos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.equipo { border: var(--borde); border-radius: 14px; padding: 12px; background: var(--papel); display: grid; gap: 8px; }
.equipo .letras { display: flex; gap: 6px; flex-wrap: wrap; }
.equipo .letras button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--tinta); background: var(--papel); font-weight: 700; }
.equipo .letras button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
.equipo b { font-family: var(--f-titulo); font-weight: 400; font-size: 40px; line-height: 1; }
.equipo input { border: 0; border-bottom: 1.5px solid var(--tinta); background: none; font-weight: 700; width: 100%; padding: 4px 0; }

#confeti { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100%; height: 100%; }
.aviso { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--tinta); color: var(--papel); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 15px; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.oculto-a11y { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (min-width: 900px) { body.en-aula .app { max-width: 1200px; } }

<body>

        <div class="compartir"><a class="boton tinta" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a><button class="boton papel" id="copiar">Copiar el reto</button>
        <a class="boton papel" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(enlace)}" target="_blank" rel="noopener">Facebook</a><a class="boton papel" href="https://x.com/intent/post?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">X</a></div></section>
      <section class="tarjeta"><h3>Lo que jugaste</h3>${R.respuestas.map(x => `<div class="indicador"><span class="nombre">${esc(x.q.texto)}</span><span class="cifras" style="color:${x.bien ? "var(--mejor)" : "var(--peor)"}">${x.bien ? "✓" : "✗"}</span><div class="pie"><span class="chico">Tú: ${esc(x.txtYo)} · Real: ${esc(x.txtEra)}</span>${fuente(x.q.fuente, x.q.url)}</div></div>`).join("")}</section>
      <div class="dos"><a class="boton papel" href="#temas">Otro tema</a><a class="boton tinta" href="#inicio">Inicio</a></div>`;
    requestAnimationFrame(() => setTimeout(() => $("#bn").style.width = Math.min(100, pct) + "%", 120));
    if (R.aciertos >= 3 || sube) { confeti(120); sBien(); }
    $("#abrir").addEventListener("click", abrirSobre);
    $("#copiar").addEventListener("click", async () => { try { await navigator.clipboard.writeText(msg); aviso("Reto copiado. Pégalo donde quieras."); } catch (e) { aviso("No se pudo copiar: mantén presionado el texto del reto."); } });
    dibujarTarjeta(destacada, R.puntos).then(u => { if (u) $("#tarjeta").src = u; });
  }
  pinta(); vista.focus?.();
}
function abrirSobre() {
  if (E.sobres <= 0) return; E.sobres -= 1;
  const r = Math.random(); const rz = r < .1 ? "legendaria" : r < .4 ? "rara" : "comun";
  let pool = D.cartas.filter(c => c.rareza === rz && !E.cartas.includes(c.id)); if (!pool.length) pool = D.cartas.filter(c => !E.cartas.includes(c.id)); if (!pool.length) pool = D.cartas;
  const c = pool[Math.floor(Math.random() * pool.length)]; const nueva = !E.cartas.includes(c.id); if (nueva) E.cartas.push(c.id); E.xp += c.rareza === "legendaria" ? 60 : c.rareza === "rara" ? 30 : 15; guardar();
  $("#sobre").outerHTML = `<section class="carta-dato" style="background:${TEMA[c.tema].c}"><div class="entre"><span class="rareza ${c.rareza}">${c.rareza === "comun" ? "Común" : c.rareza === "rara" ? "¡Rara!" : "¡¡Legendaria!!"}</span><span class="chico" style="color:var(--tinta)">${nueva ? "Nueva" : "Repetida"} · ${E.cartas.length} de ${D.cartas.length}</span></div>
    <p style="font-family:var(--f-titulo);font-size:26px;line-height:1.15">${esc(c.texto)}</p>${fuente(c.fuente, c.url)}</section>`;
  if (c.rareza !== "comun") confeti(c.rareza === "legendaria" ? 160 : 80); sBien();
}

/* tarjeta para compartir (1080×1920, historias) */
async function dibujarTarjeta(x, puntos) {
  try {
    await Promise.all(['64px "Instrument Serif"', 'italic 64px "Instrument Serif"', '700 40px "Instrument Sans"', '700 60px "Caveat"'].map(f => document.fonts.load(f)));
    const cv = document.createElement("canvas"); cv.width = 1080; cv.height = 1920; const c = cv.getContext("2d");
    c.fillStyle = "#F7F2E8"; c.fillRect(0, 0, 1080, 1920); c.fillStyle = "#D8CFBE"; for (let y = 11; y < 1920; y += 44) for (let xx = 11; xx < 1080; xx += 44) { c.beginPath(); c.arc(xx, y, 2.6, 0, 6.3); c.fill(); }
    const nota = (xx, y, w, h, col, rot) => { c.save(); c.translate(xx, y); c.rotate(rot); c.fillStyle = col; c.shadowColor = "rgba(28,27,31,.25)"; c.shadowBlur = 24; c.shadowOffsetY = 12; c.fillRect(0, 0, w, h); c.restore(); };
    nota(760, 250, 210, 210, "#CDEBDC", .12); nota(110, 1510, 190, 190, "#FFD2DD", -.08);
    const logo = $(".logo svg").outerHTML.replace(/currentColor/g, "#1C1B1F"); const im = new Image(); im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(logo); await im.decode(); c.drawImage(im, 90, 230, 440, 195);
    c.fillStyle = "#1C1B1F"; c.font = '700 64px "Caveat"'; c.fillText("Para:", 96, 640); c.fillRect(270, 655, 520, 4);
    c.font = '700 72px "Caveat"'; c.fillText("quien se atreva", 290, 640); if (E.nombre) { c.font = '700 48px "Caveat"'; c.fillStyle = "#55505B"; c.fillText("De: " + E.nombre, 96, 720); c.fillStyle = "#1C1B1F"; }
    c.font = '700 40px "Instrument Sans"'; c.fillStyle = "#55505B"; wrap(c, x.q.texto, 96, 780, 880, 52, '700 40px "Instrument Sans"');
    c.fillStyle = "#1C1B1F"; c.font = '80px "Instrument Serif"'; c.fillText("Yo dije", 96, 1080); c.font = '170px "Instrument Serif"'; c.fillText(x.txtYo, 96, 1240);
    c.fillStyle = "#FFECAE"; const w = c.measureText(x.txtEra).width; c.fillRect(96, 1320, Math.max(320, w + 300), 120); c.fillStyle = "#1C1B1F"; c.font = 'italic 80px "Instrument Serif"'; c.fillText("Eran", 96, 1410); c.font = '170px "Instrument Serif"'; c.fillText(x.txtEra, 300, 1430);
    c.font = '700 96px "Caveat"'; c.fillText("¿Me ganas?", 380, 1640); c.font = '700 40px "Instrument Sans"'; c.fillText(`${puntos} puntos · reto de 5 preguntas`, 380, 1710);
    c.font = '600 30px "Instrument Sans"'; c.fillStyle = "#55505B"; c.fillText(`Dato: ${(x.q.fuente || "").slice(0, 60)}`, 96, 1820);
    return cv.toDataURL("image/png");
  } catch (e) { return null; }
}
function wrap(c, t, x, y, maxW, lh, font) { c.font = font; const ws = t.split(" "); let l = ""; for (const w of ws) { const p = l ? l + " " + w : w; if (c.measureText(p).width > maxW && l) { c.fillText(l, x, y); y += lh; l = w; } else l = p; } c.fillText(l, x, y); }

/* ---------- AULA ---------- */
function vAula() {
  vista.innerHTML = `<section style="display:grid;gap:10px"><span class="mano">Modo aula</span><h1>Juega con todo <em>el curso</em>.</h1>
  <p>Proyecta esta pantalla. Cada equipo responde en voz alta o con la mano, y tú marcas su respuesta. Sin celulares, sin cuentas y sin nombres de estudiantes.</p></section>
  <section class="tarjeta"><h3>Equipos</h3><div class="equipos" id="eq-config">${["Equipo A", "Equipo B", "Equipo C", "Equipo D"].map((n, i) => `<label class="equipo" style="background:${COLORES[i]}"><span class="chico" style="color:var(--tinta)">Nombre del equipo ${i + 1}</span><input id="eq${i}" value="${n}" maxlength="20"></label>`).join("")}</div>
    <div class="fila"><label class="chico" for="n-eq">Equipos:</label><select id="n-eq" class="chip"><option>2</option><option>3</option><option selected>4</option></select>
    <label class="chico" for="tema-aula">Tema:</label><select id="tema-aula" class="chip"><option value="">Todos</option>${TEMAS.map(t => `<option value="${t.id}">${t.nombre}</option>`).join("")}</select></div>
    <button class="boton tinta ancho" id="empezar">Empezar · 10 preguntas</button></section>
  <p class="chico">En colegios: nada de logos de partidos, candidatos ni autoridades. Las preguntas son de datos, no de opinión.</p>`;
  $("#empezar").addEventListener("click", () => {
    const n = +$("#n-eq").value; const eqs = Array.from({ length: n }, (_, i) => ({ nombre: $("#eq" + i).value || "Equipo " + "ABCD"[i], pts: 0, r: null })); const tema = $("#tema-aula").value;
    const pool = mezcla(D.preguntas.filter(q => q.tipo !== "adivina" && (!tema || q.tema === tema)), rng(Date.now() % 1e6)).slice(0, 10);
    jugarAula(eqs, pool);
  });
}
function opcionesDe(q) { return q.tipo === "vf" ? ["Verdadero", "Falso"] : q.tipo === "masmenos" ? ["Más", "Menos"] : q.opciones; }
function correctaDe(q) { return q.tipo === "vf" ? (q.resp ? "Verdadero" : "Falso") : q.tipo === "masmenos" ? (q.resp > q.v0 ? "Más" : "Menos") : q.resp; }
function jugarAula(eqs, qs, i = 0) {
  if (i >= qs.length) { const orden = [...eqs].sort((a, b) => b.pts - a.pts); confeti(160); sBien();
    setTimeout(() => $$("[data-salir-aula]").forEach(b => b.addEventListener("click", vAula)), 0);
    vista.innerHTML = `<section class="aula-pantalla"><span class="mano" style="font-size:40px">¡Ganó ${esc(orden[0].nombre)}!</span><h1 class="aula-pregunta">Tabla final</h1><div class="equipos">${orden.map((e, k) => `<div class="equipo" style="background:${COLORES[eqs.indexOf(e)]}"><span class="chico" style="color:var(--tinta)">${k + 1}.º lugar</span><h3>${esc(e.nombre)}</h3><b class="num">${e.pts}</b></div>`).join("")}</div><button class="boton tinta" data-salir-aula>Jugar otra vez</button></section>`; return; }
  const q = qs[i], ops = opcionesDe(q); eqs.forEach(e => e.r = null);
  vista.innerHTML = `<section class="aula-pantalla"><div class="entre"><span class="etiqueta">Pregunta ${i + 1} de ${qs.length} · ${TEMA[q.tema].nombre}</span><button class="chip" data-salir-aula>Salir</button></div>
    ${q.tipo === "masmenos" ? `<p class="mano" style="font-size:30px">En ${q.a0}: ${fmt(q.v0, dec(q.v0))} · ${esc(q.nombre)}</p>` : ""}
    <p class="aula-pregunta">${esc(q.texto)}</p>
    <div class="aula-ops">${ops.map((o, k) => `<div class="opcion" style="--c:${COLORES[k % 4]}" data-op="${esc(o)}"><span class="letra">${"ABCD"[k]}</span>${esc(o)}</div>`).join("")}</div>
    <div class="equipos">${eqs.map((e, k) => `<div class="equipo" style="background:${COLORES[k]}"><div class="entre"><h3>${esc(e.nombre)}</h3><b class="num" style="font-size:32px">${e.pts}</b></div><div class="letras" role="group" aria-label="Respuesta de ${esc(e.nombre)}">${ops.map((o, j) => `<button aria-pressed="false" data-eq="${k}" data-o="${esc(o)}" aria-label="${esc(o)}">${"ABCD"[j]}</button>`).join("")}</div></div>`).join("")}</div>
    <button class="boton tinta" id="revelar-aula">Revelar respuesta</button><div id="aula-rev"></div></section>`;
  $$("[data-salir-aula]").forEach(b => b.addEventListener("click", vAula));
  $$("[data-eq]").forEach(b => b.addEventListener("click", () => { const e = eqs[+b.dataset.eq]; e.r = b.dataset.o; $$(`[data-eq="${b.dataset.eq}"]`).forEach(x => x.setAttribute("aria-pressed", x === b)); tono(520, .05); }));
  $("#revelar-aula").addEventListener("click", () => {
    const ok = correctaDe(q); $$("[data-op]").forEach(o => o.classList.add(o.dataset.op === ok ? "bien" : "x"));
    eqs.forEach(e => { if (e.r === ok) e.pts += 100; }); $$("[data-eq]").forEach(b => b.disabled = true); sBien();
    $("#revelar-aula").remove();
    $("#aula-rev").innerHTML = `<section class="tarjeta revelar"><p style="font-size:22px"><b>${esc(ok)}</b>${q.tipo === "masmenos" ? ` · en ${q.a1}: ${fmt(q.resp, dec(q.resp))}` : ""}</p>${q.expl ? `<p>${esc(q.expl)}</p>` : ""}${fuente(q.fuente, q.url)}<button class="boton tinta" id="sig-aula">${i + 1 < qs.length ? "Siguiente pregunta" : "Ver tabla final"}</button></section>`;
    $("#sig-aula").addEventListener("click", () => { jugarAula(eqs, qs, i + 1); scrollTo(0, 0); });
  });
}
